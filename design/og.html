<!doctype html><html><head><meta charset="utf-8"><style>
/* Share card for kylepace.dev/recipe-search/ (public/recipe-search/og.png). Render at
   1200x630 (share-card skill). Dark values from src/styles/theme.css; it draws the
   page's own search box with an ingredient and a creator in it (design/PLAN.md). */
@font-face{font-family:A;font-weight:400;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-400-normal.woff2")}
@font-face{font-family:A;font-weight:700;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-700-normal.woff2")}
html,body{margin:0}
body{width:1200px;height:630px;background:#101413;color:#e9f0ee;font-family:A;overflow:hidden;box-sizing:border-box;padding:64px 96px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.name{font-size:96px;font-weight:700;letter-spacing:-0.03em;line-height:1;margin:0}
.from{font-size:30px;color:#a0aeaa;margin:22px 0 0}
.box{margin-top:56px;width:960px;box-sizing:border-box;display:flex;align-items:center;gap:16px;padding:18px 18px 18px 26px;border:3px solid #7fc9b6;border-radius:12px;background:#171c1b;font-size:36px;text-align:left}
.tag{font-weight:700;background:#1f3a34;border-radius:7px;padding:8px 16px}
.creator{background:none;box-shadow:inset 0 0 0 3px #1f3a34}
.x{color:#a0aeaa;font-weight:400;margin-left:10px}
.text{flex:1}
.go{width:66px;height:66px;border-radius:8px;background:#7fc9b6;display:grid;place-items:center}
</style></head><body>
<p class="name">Recipe search</p>
<p class="from">The Woks of Life, Hot Thai Kitchen, Smitten Kitchen and more, at once.</p>
<div class="box"><span class="tag creator">from Hot Thai Kitchen<span class="x">×</span></span><span class="tag">ginger<span class="x">×</span></span><span class="text">curry</span>
<span class="go"><svg viewBox="0 0 24 24" width="34" height="34"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#101413" stroke-width="2.4"/><path d="m15.5 15.5 5 5" stroke="#101413" stroke-width="2.4" stroke-linecap="round"/></svg></span></div>
</body></html>
