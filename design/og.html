<!doctype html><html><head><meta charset="utf-8"><style>
/* Share card for kylepace.dev/recipe-search/ (public/recipe-search/og.png). Render at
   1200x630 (share-card skill). Colors are kp-design's dark-theme tokens, the mint accent
   and each site's tint from the page. */
@font-face{font-family:A;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-400-normal.woff2")}
@font-face{font-family:A;font-weight:700;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-700-normal.woff2")}
@font-face{font-family:M;src:url("../node_modules/@fontsource/atkinson-hyperlegible-mono/files/atkinson-hyperlegible-mono-latin-400-normal.woff2")}
html,body{margin:0}
body{width:1200px;height:630px;background:#141317;font-family:A;overflow:hidden;position:relative;color:#f3efe8}
.glow{position:absolute;inset:-240px auto auto -180px;width:900px;height:640px;background:radial-gradient(ellipse at center,rgba(45,212,191,.2),transparent 65%)}
.card{position:relative;box-sizing:border-box;width:1200px;height:630px;padding:72px 72px 72px 80px;display:grid;grid-template-columns:520px 1fr;gap:56px}
.text{display:flex;flex-direction:column;justify-content:space-between}
.mark{font-family:M;font-size:34px}.mark b{font-weight:400;color:#5eead4}
h1{margin:0;font-size:68px;line-height:1.04;letter-spacing:-0.02em;font-weight:700}
.sub{margin:22px 0 0;font-size:30px;line-height:1.35;color:#aaa5b2}
.path{font-family:M;font-size:28px;color:#aaa5b2}
.ui{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.field{display:flex;align-items:center;gap:14px;height:72px;padding:0 10px 0 26px;background:#1e1c22;border:3px solid #5eead4;border-radius:999px;font-size:30px}
.field svg{flex:none}
.field .t{flex:1;color:#f3efe8}
.go{height:54px;padding:0 26px;border-radius:999px;background:#f3efe8;color:#141317;font-weight:700;font-size:24px;display:grid;place-items:center}
.chips{display:flex;gap:12px}
.chip{white-space:nowrap;height:50px;padding:0 20px;border-radius:999px;border:2px solid #5eead4;background:rgba(45,212,191,.18);font-size:23px;display:flex;align-items:center;gap:10px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.r .ph{height:150px;border-radius:16px;position:relative}
.r .tm{position:absolute;left:10px;bottom:10px;padding:3px 12px;border-radius:999px;background:rgba(20,19,23,.85);font-size:19px;font-weight:700}
.r .ln{height:16px;border-radius:8px;background:#3a3640;margin-top:14px}
.r .ln.s{width:60%;margin-top:10px;display:flex;align-items:center;gap:8px;background:none}
.r .ln.s i{width:14px;height:14px;border-radius:4px;display:block}
.r .ln.s span{flex:1;height:12px;border-radius:6px;background:#2e2b34}
</style></head><body>
<div class="glow"></div>
<div class="card">
  <div class="text">
    <div class="mark">kylepace<b>.dev</b></div>
    <div>
      <h1>One search box for the recipe sites I trust.</h1>
      <p class="sub">Search by dish, or by what you have. Every result opens on the creator’s site.</p>
    </div>
    <div class="path">/recipe-search</div>
  </div>
  <div class="ui">
    <div class="field"><svg viewBox="0 0 24 24" width="30" height="30"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#aaa5b2" stroke-width="2.2"/><path d="m15.5 15.5 5 5" stroke="#aaa5b2" stroke-width="2.2" stroke-linecap="round"/></svg><span class="t">noodle soup</span><span class="go">Search</span></div>
    <div class="chips"><span class="chip">ginger <b>×</b></span><span class="chip">green onion <b>×</b></span><span class="chip">tofu <b>×</b></span></div>
    <div class="res">
      <div class="r"><div class="ph" style="background:linear-gradient(135deg,#5a1d17,#c8382c)"><span class="tm">15 min</span></div><div class="ln"></div><div class="ln s"><i style="background:#c8382c"></i><span></span></div></div>
      <div class="r"><div class="ph" style="background:linear-gradient(135deg,#5b4110,#d79a22)"><span class="tm">30 min</span></div><div class="ln"></div><div class="ln s"><i style="background:#d79a22"></i><span></span></div></div>
      <div class="r"><div class="ph" style="background:linear-gradient(135deg,#3b2758,#8a5cc4)"><span class="tm">45 min</span></div><div class="ln"></div><div class="ln s"><i style="background:#8a5cc4"></i><span></span></div></div>
      
    </div>
  </div>
</div>
</body></html>
