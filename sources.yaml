  - id: sudachi-yt
    name: Sudachi
    site: sudachi
    channel: https://www.youtube.com/@SudachiRecipes
    via: youtube-data-api
  - id: mwl-yt
    name: Made With Lau
    site: mwl
    channel: https://www.youtube.com/@MadeWithLau
