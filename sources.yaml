  - id: rhs-yt
    name: Red House Spice
    channel: https://www.youtube.com/@redhousespice   # "Wei's Red House Kitchen"
    via: youtube-data-api
    note: her site's terms bar copying or storing its content without written consent, so the site is link-only (below) and isn't crawled. If she agrees, add a recipes entry with id rhs and tie this channel to it with site
  - id: fca
    name: French Cooking Academy
    channel: https://www.youtube.com/@FrenchCookingAcademy
    via: youtube-data-api
    note: its site (thefrenchcookingacademy.com; frenchcookingacademy.com is a parked domain) has about 960 recipe pages but no Recipe data, and its terms bar copying its materials, so it isn't crawled
  - id: ab-yt
    name: Alton Brown
    site: ab
    channel: https://www.youtube.com/@AltonBrown   # UCfDNi1aEljAQ17mUrfUjkvg, the channel altonbrown.com links to (checked 2026-11-08)
    via: youtube-data-api

link_only:
  - name: Serious Eats
    search: https://www.seriouseats.com/search?q={q}
    reason: owner (People Inc.) requires written permission for automated collection
  - name: Red House Spice
    search: https://redhousespice.com/?s={q}
    reason: its terms (redhousespice.com/terms/, checked 2026-11-08) say "Copying or storing our content for other than personal use is expressly prohibited without our prior written consent." robots.txt would allow us (it blocks AI bots only), and pages carry full Recipe data, so it's ready to crawl if Wei Guo agrees
  - name: All of Kenji's videos
    search: https://www.youtube.com/@JKenjiLopezAlt/search?query={q}
    reason: backstop for anything the index misses
