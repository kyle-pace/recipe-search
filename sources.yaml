# Every source, how it's collected, and the result of its last check.
# Checked by hand on 2026-11-01: robots.txt, sitemap, and a few recipe pages.
# The crawler (crawler/crawl.mjs) reads this file. Per site: sitemap (path),
# format (json-ld or microdata), default_cuisine, and include (a pattern a
# page's URL must match), and paused (a reason; the crawler skips the site).
# Results of each run are in data/status.json.

recipes:
  - id: woks
    name: The Woks of Life
    site: https://thewoksoflife.com
    sitemap: /sitemap_index.xml        # not listed in robots.txt
    format: json-ld                    # full schema.org Recipe
    allowed: true                      # blocks AI training bots only; stay out of /wp-json/
    size: about 1,600 posts
  - id: joc
    name: Just One Cookbook
    site: https://www.justonecookbook.com
    sitemap: /sitemap_index.xml
    format: json-ld
    default_cuisine: Japanese
    allowed: true                      # only site search is off limits
    paused: refuses cloud servers (HTTP 403 on its post sitemap from GitHub Actions, 2026-11-02)
    size: 1,000 to 2,000 posts
  - id: htk
    name: Hot Thai Kitchen
    site: https://hot-thai-kitchen.com
    sitemap: /sitemap_index.xml
    format: json-ld                    # total time and cuisine often missing
    default_cuisine: Thai
    allowed: true
    size: about 470 posts
  - id: sk
    name: Smitten Kitchen
    site: https://smittenkitchen.com
    sitemap: /sitemap.xml
    include: '^https://smittenkitchen\.com/\d{4}/\d{2}/'   # posts only, not pages
    format: microdata                  # name, yield, total time as text, ingredients; photo from og:image
    allowed: true
    size: 1,000+ posts
  - id: maangchi
    name: Maangchi
    site: https://www.maangchi.com
    sitemap: /sitemap.xml              # index of yearly post sitemaps; recipes are under /recipe/
    include: '/recipe/'
    format: json-ld                    # older recipes have an empty ingredient list; match them by title and keywords
    default_cuisine: Korean
    allowed: true                      # blocks AI training bots only (checked 2026-11-01)
    paused: refuses cloud servers (HTTP 403 on its sitemap from GitHub Actions, 2026-11-02)
    size: 451 recipes (of 2,278 posts)
    note: her site refuses cloud servers for now, so her YouTube channel (under videos) carries her recipes meanwhile

# YouTube channels, through the official YouTube Data API only (uploads list;
# titles, short descriptions and thumbnails, no transcripts). `site` ties a
# channel to its recipe site above, for the About list, support links and the
# Site filter. Added 2026-11-08 (Kyle: every source that has a channel).
videos:
  - id: kenji
    name: J. Kenji López-Alt
    channel: https://www.youtube.com/@JKenjiLopezAlt
    via: youtube-data-api
    note: kenjilopezalt.com and his Patreon have no recipe data to index
  - id: woks-yt
    name: The Woks of Life
    site: woks
    channel: https://www.youtube.com/@Thewoksoflife1
    via: youtube-data-api
  - id: htk-yt
    name: Hot Thai Kitchen
    site: htk
    channel: https://www.youtube.com/@PailinsKitchen
    via: youtube-data-api
  - id: sk-yt
    name: Smitten Kitchen
    site: sk
    channel: https://www.youtube.com/@smittenkitchening
    via: youtube-data-api
  - id: joc-yt
    name: Just One Cookbook
    site: joc
    channel: https://www.youtube.com/@JustOneCookbook
    via: youtube-data-api
  - id: maangchi-yt
    name: Maangchi
    site: maangchi
    channel: https://www.youtube.com/@Maangchi
    via: youtube-data-api
  - id: ccd
    name: Chinese Cooking Demystified
    channel: https://www.youtube.com/@ChineseCookingDemystified
    via: youtube-data-api
    note: regional Chinese technique videos; no recipe site to index (added at Kyle's yes, 2026-11-08)

link_only:
  - name: Serious Eats
    search: https://www.seriouseats.com/search?q={q}
    reason: owner (People Inc.) requires written permission for automated collection
  - name: All of Kenji's videos
    search: https://www.youtube.com/@JKenjiLopezAlt/search?query={q}
    reason: backstop for anything the index misses
