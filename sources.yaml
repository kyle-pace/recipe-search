# Every source, how it's collected, and the result of its last check.
# Checked by hand on 2026-11-01: robots.txt, sitemap, and a few recipe pages.
# The crawler (crawler/crawl.mjs) reads this file. Per site: sitemap (path),
# format (json-ld or microdata), default_cuisine, and include (a pattern a
# page's URL must match), and paused (a reason; the crawler skips the site).
# Results of each run are in data/status.json.

recipes:
  - id: woks
    name: The Woks of Life
    site: https://thewoksoflife.com
    sitemap: /sitemap_index.xml        # not listed in robots.txt
    format: json-ld                    # full schema.org Recipe
    allowed: true                      # blocks AI training bots only; stay out of /wp-json/
    size: about 1,600 posts
  - id: joc
    name: Just One Cookbook
    site: https://www.justonecookbook.com
    sitemap: /sitemap_index.xml
    format: json-ld
    default_cuisine: Japanese
    allowed: true                      # only site search is off limits
    paused: Cloudflare bot protection blocks automated requests (HTTP 403 on its sitemap from GitHub Actions and from a home connection, with or without our crawler's name; robots.txt allows us; checked 2026-11-08). Needs the site to allow us
    size: 1,000 to 2,000 posts
  - id: htk
    name: Hot Thai Kitchen
    site: https://hot-thai-kitchen.com
    sitemap: /sitemap_index.xml
    format: json-ld                    # total time and cuisine often missing
    default_cuisine: Thai
    allowed: true
    size: about 470 posts
  - id: sk
    name: Smitten Kitchen
    site: https://smittenkitchen.com
    sitemap: /sitemap.xml
    include: '^https://smittenkitchen\.com/\d{4}/\d{2}/'   # posts only, not pages
    format: microdata                  # name, yield, total time as text, ingredients; photo from og:image
    allowed: true
    size: 1,000+ posts
  - id: maangchi
    name: Maangchi
    site: https://www.maangchi.com
    sitemap: /sitemap.xml              # index of yearly post sitemaps; recipes are under /recipe/
    include: '/recipe/'
    format: json-ld                    # older recipes have an empty ingredient list; match them by title and keywords
    default_cuisine: Korean
    allowed: true                      # blocks AI training bots only (checked 2026-11-01)
    paused: Cloudflare bot protection blocks automated requests (HTTP 403 on its sitemap from GitHub Actions and from a home connection, with or without our crawler's name; robots.txt allows us; checked 2026-11-08). Needs the site to allow us
    size: 451 recipes (of 2,278 posts)
    note: her site blocks automated requests for now, so her YouTube channel (under videos) carries her recipes meanwhile
  # Added 2026-11-08. Each checked that day: robots.txt (as RecipeSearchBot, the *
  # group and AI-bot groups), terms, sitemap shape, and the crawler's own reader
  # run on sample recipe pages.
  - id: mala
    name: The Mala Market
    site: https://blog.themalamarket.com   # the recipes are on the blog; themalamarket.com is the shop
    sitemap: /sitemap_index.xml
    include: '^https://blog\.themalamarket\.com/(?!shop/)[^/]+/$'   # posts only; its affiliate sitemap lists 105 /shop/ pages
    format: json-ld                    # Recipe card on 12 of 14 sampled posts, old and new; no total time
    default_cuisine: Chinese
    allowed: true                      # robots.txt allows everything; the blog has no terms page, and the shop's (Shopify) terms say nothing on automated access
    size: about 225 posts
  - id: rte
    name: RecipeTin Eats
    site: https://www.recipetineats.com
    sitemap: /sitemap_index.xml        # listed in robots.txt; four post sitemaps
    format: json-ld                    # cuisine is often "Western"
    allowed: true                      # generic bots allowed; blocks a few AI bots only. Its use policy bars commercial use and republishing a recipe's ingredients and method; we keep ingredient names only, never the method, and link every result
    size: about 1,750 posts
  - id: rtj
    name: RecipeTin Japan
    site: https://japan.recipetineats.com
    sitemap: /sitemap_index.xml        # no robots.txt (404), so no rules; attachment sitemaps are skipped
    format: json-ld                    # cuisine often missing; a few guide posts have no recipe card
    default_cuisine: Japanese
    allowed: true                      # no terms page, only privacy and disclosure
    size: about 440 posts
  - id: sudachi
    name: Sudachi
    site: https://sudachirecipes.com
    delay_seconds: 12                  # answered HTTP 429 (too many requests) after about 500 pages at 4 seconds apart, 2026-11-09
    sitemap: /sitemap_index.xml        # listed in robots.txt
    format: json-ld
    default_cuisine: Japanese
    allowed: true                      # robots.txt only blocks /wp-admin/ and /cdn-cgi/; no terms page, only privacy
    size: about 600 posts
  - id: mwl
    name: Made With Lau
    site: https://www.madewithlau.com  # the bare domain redirects here
    sitemap: /sitemap.xml              # listed in robots.txt; one urlset, not an index
    include: '^https://www\.madewithlau\.com/recipes/[^/]+$'   # recipes only, not lessons, courses or the blog
    format: json-ld                    # photos come from its image CDN, cdn.sanity.io
    default_cuisine: Chinese
    allowed: true                      # robots.txt allows everything but /private/; no terms page, only privacy
    size: 197 recipes (of about 388 URLs)
  # Added 2026-11-08, checked the same way.
  - id: ab
    name: Alton Brown
    site: https://altonbrown.com       # www. redirects here
    sitemap: /sitemap_index.xml        # robots.txt lists /sitemap.xml, which 301s here (Yoast); recipes are in recipes-sitemap.xml
    include: '^https://altonbrown\.com/recipes/[^/]+/$'   # recipes only; the index also lists blog posts, books, videos and shop pages. Read through the index so a second recipes sitemap past 1,000 is still found
    format: json-ld                    # WP Recipe Maker card on 5 of 5 sampled recipes, 2020 to now; no cuisine (it's in keywords), category is the course
    allowed: true                      # robots.txt only blocks /wp-admin/. Its only terms page (/terms-conditions/; /terms/, /terms-of-use/ and /terms-and-conditions/ 301 to the home page) is a privacy and cookie policy that says nothing on copying, storing or automated access
    size: 947 recipes

